# ─────────────────────────────────────────────────────────────────────────────
# Him Cab AI Travel Assistant
#
# One file for packaging and every tool's configuration. `pip install -e .` makes
# `app` importable from anywhere, which is why neither pytest nor the Dockerfile
# needs a PYTHONPATH= prefix any more.
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "himcab-ai-assistant"
version = "1.0.0"
description = "Him Cab AI Tourist Travel Assistant — LangGraph-powered travel concierge for Himachal Pradesh"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "ImmersiveData", email = "dev@immersivedata.in"},
]
readme = "README.md"

# Runtime dependencies. requirements.txt is generated from this list — see the
# `lock` target in the Makefile — so this is the single place a version is bumped.
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "langgraph==0.2.35",
    "langchain==0.3.3",
    "langchain-google-vertexai==2.0.1",
    "langchain-core==0.3.10",
    "google-cloud-firestore==2.19.0",
    "google-cloud-pubsub==2.26.1",
    "google-cloud-secret-manager==2.20.2",
    "google-cloud-logging==3.11.1",
    "google-auth==2.35.0",
    "firebase-admin==6.5.0",
    "vertexai==1.71.1",
    "httpx==0.27.2",
    "tenacity==8.5.0",
    "sse-starlette==2.1.3",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "python-jose[cryptography]==3.3.0",
    "langdetect==1.0.9",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
]

[project.urls]
Documentation = "docs/"
Repository = "https://github.com/immersivedata/himcab-ai-assistant"

# Ship the package and its data files. The YAML prompt templates are loaded at
# runtime by app/prompts/builder.py, so a wheel without them starts and then fails
# on the first request — include them explicitly.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["templates/*.yaml"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = false
log_level = "INFO"
# --strict-markers: a typo'd marker fails the run instead of silently matching
# nothing, which is how an entire directory stops being exercised unnoticed.
addopts = "--strict-markers --strict-config"
markers = [
    "slow: long-running; deselect with -m 'not slow'",
    "integration: talks to a real backend or provider; needs credentials. Not run in CI — see tests/integration/README.md",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == .__main__.:',
]

# ── Ruff (Linter + Formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# This codebase writes prose in its docstrings and uses real typography to do it —
# en dashes, × in "3 × 4". RUF001-003 flag those as confusable with ASCII, which is a
# rule aimed at identifiers and security-sensitive strings, not at a comment
# explaining a design decision.
allowed-confusables = ["–", "—", "×", "−"]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "A003",   # class attribute shadowing builtin (Pydantic models use 'type', 'id')
    "N805",   # first argument of a method should be named 'self' (Pydantic validators)
    # UP007/UP045: ruff would rewrite `Optional[X]` to `X | None`. This codebase
    # deliberately keeps `Optional` — it reads as intent ("this may be absent") where
    # `| None` reads as a type union, and the distinction matters in models whose
    # optionality IS the design (a fare that could not be fetched, a fix the phone
    # never sent). UP045 is the same rule as UP007, split out by ruff after this
    # config was written; ignoring one without the other was an accident of timing.
    "UP007",
    "UP045",
    # UP042: prefers `enum.StrEnum` over `class X(str, Enum)`. app/core/enums.py
    # defines its own StrEnum shim on purpose and documents why; the stdlib version
    # differs in __str__ and __format__ behaviour, which these values rely on when
    # they are interpolated into prompts and JSON.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── Mypy (Type Checking) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = [
    "tests/",
    "scripts/",
    "graphify-out/",
    "docs/",
]

[[tool.mypy.overrides]]
module = [
    "firebase_admin.*",
    "vertexai.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_google_vertexai.*",
    "langgraph.*",
    "redis.*",
    "structlog.*",
    "sse_starlette.*",
    "tenacity.*",
    "google.cloud.*",
]
ignore_missing_imports = true
