version: "3.9"

services:
  # ── Main API Service ────────────────────────────────────────────────────────
  # The only stateful dependency is Firestore, which is remote. Caching and rate
  # limiting are in-process (app/services/local_cache.py), so there is nothing else
  # to stand up locally.
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ./app:/app/app        # Hot reload in dev
      - ./frontend:/app/frontend   # Test UI: local-only mount (excluded from Cloud Run image)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
